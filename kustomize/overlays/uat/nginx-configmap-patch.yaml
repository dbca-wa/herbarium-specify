# UAT override of the in-cluster nginx config.
#
# Identical to kustomize/base/nginx-configmap.yaml EXCEPT the backend proxy
# advertises a constant `X-Forwarded-Proto: https`. The cluster only ever
# receives HTTP (TLS terminates at the IT edge proxy), so the default
# `$scheme` would be `http` and Specify would build an http:// OAuth redirect
# URI that Entra ID rejects (AADSTS50011).

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    upstream specify_backend {
        server specify:8000;
    }

    upstream asset_server {
        server asset-server:8080;
    }

    server {
        listen 80;
        server_name _;

        # Allow large file uploads (e.g. CSV via Workbench)
        client_max_body_size 50M;

        # Proxy to Specify backend
        location / {
            proxy_pass http://specify_backend;
            proxy_set_header Host $host;
            # UAT: force https so Specify builds https OAuth redirect URIs.
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
        }

        # Serve static files
        # JS/CSS bundles have content hashes in filenames
        location /static/js/ {
            alias /static-files/js/;
            try_files $uri $uri/ =404;
        }

        # Images, config, and other static files
        location /static/ {
            alias /static-files/;
            try_files $uri $uri/ =404;
        }

        # Proxy asset server requests
        location /web_asset_store.xml {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /fileget {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /fileupload {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /getmetadata {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /testkey {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }
    }
