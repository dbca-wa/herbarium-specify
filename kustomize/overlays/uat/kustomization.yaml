apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: herbarium-specify

# Reference the base
resources:
- ../../base

# Generate secrets from .env file
secretGenerator:
- name: specify-secrets
  envs:
  - .env
  options:
    disableNameSuffixHash: true

# Generate the SSO settings overlay module ConfigMap (non-secret).
# Mounted into the specify/specify-worker containers as uat_sso_settings.py.
configMapGenerator:
- name: sso-settings
  files:
  - uat_sso_settings.py
  options:
    disableNameSuffixHash: true

# Apply patches
patches:
- path: deployment-patch.yaml
  target:
    kind: Deployment
    name: specify
- path: specify-worker-patch.yaml
  target:
    kind: Deployment
    name: specify-worker
- path: ingress-patch.yaml
  target:
    kind: Ingress
    name: specify-ingress
- path: asset-server-patch.yaml
  target:
    kind: Deployment
    name: asset-server
# UAT nginx override: advertise X-Forwarded-Proto https for OAuth redirect URIs
- path: nginx-configmap-patch.yaml
  target:
    kind: ConfigMap
    name: nginx-config
# Exclude asset-storage PVC (using inline CSI volume instead)
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: asset-storage
# Exclude MariaDB resources (using Azure MySQL instead)
# Remove MariaDB deployment, service, and PVC
- patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: mariadb
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: mariadb
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: mariadb-storage

# Add labels to all resources
labels:
- pairs:
    environment: uat
    managed-by: kustomize

# Add common annotations
commonAnnotations:
  version: v7.12.0.6
