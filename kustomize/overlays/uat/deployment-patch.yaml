apiVersion: apps/v1
kind: Deployment
metadata:
  name: specify
spec:
  replicas: 1
  template:
    spec:
      initContainers:
      - $patch: delete
        name: wait-for-mariadb
      containers:
      - name: specify
        env:
        # Use the UAT SSO overlay settings module (layers on top of "settings").
        - name: DJANGO_SETTINGS_MODULE
          value: "uat_sso_settings"
        volumeMounts:
        - name: sso-settings
          mountPath: /opt/specify7/uat_sso_settings.py
          subPath: uat_sso_settings.py
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            # Specify 7.12.0.6 loads every related record when checking delete
            # blockers, so opening the taxon tree definition form needs about
            # 4 GB per request (50k taxa, 577k determinations) and crashed the
            # pod at 3Gi. Fixed upstream in 7.12.3 (specify/specify7#8238);
            # return to 3Gi after upgrading.
            memory: "12Gi"
            cpu: "1000m"
      volumes:
      - name: sso-settings
        configMap:
          name: sso-settings
