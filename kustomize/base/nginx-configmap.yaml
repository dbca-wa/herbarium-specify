apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app: specify
    component: nginx
data:
  nginx.conf: |
    upstream specify_backend {
        server specify:8000;
    }

    upstream asset_server {
        server asset-server:8080;
    }

    server {
        listen 80;
        server_name _;

        # Allow large file uploads (e.g. CSV via Workbench)
        client_max_body_size 50M;

        # Proxy to Specify backend
        location / {
            proxy_pass http://specify_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve static files
        # JS/CSS bundles have content hashes in filenames
        location /static/js/ {
            alias /static-files/js/;
            try_files $uri $uri/ =404;
        }

        # Images, config, and other static files
        location /static/ {
            alias /static-files/;
            try_files $uri $uri/ =404;
        }

        # Proxy asset server requests
        location /web_asset_store.xml {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /fileget {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /fileupload {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /getmetadata {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /testkey {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }
    }

