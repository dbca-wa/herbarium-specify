apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app: specify
    component: nginx
data:
  nginx.conf: |
    upstream specify_backend {
        server specify:8000;
    }

    upstream asset_server {
        server asset-server:8080;
    }

    server {
        listen 80;
        server_name _;
        # Remove client_max_body_size - edge proxy already sets this

        # Proxy to Specify backend
        location / {
            proxy_pass http://specify_backend;
            proxy_set_header Host $host;
            # Remove X-Real-IP and X-Forwarded-For - edge proxy already sets these
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            # Prevent browsers from caching HTML/API responses across version upgrades
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        # Serve static files from copied location (includes config files)
        # JS/CSS bundles have content hashes in filenames - safe to cache long-term
        location /static/js/ {
            alias /static-files/js/;
            try_files $uri $uri/ =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Images, config, and other static files without content hashes
        location /static/ {
            alias /static-files/;
            try_files $uri $uri/ =404;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        # Proxy asset server requests
        location /web_asset_store.xml {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /fileget {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /fileupload {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /getmetadata {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }

        location /testkey {
            proxy_pass http://asset_server;
            proxy_set_header Host $host;
        }
    }

